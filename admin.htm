<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART PRONO - ADMIN</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;padding:15px}
h1{color:#FFD700;text-align:center}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:10px 0}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none}
button{padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.btn-green{background:#00c853;color:white}
.btn-red{background:#ff1744;color:white}
.btn-gold{background:#FFD700;color:black}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.ok{background:#00c853} .bad{background:#ff1744} .wait{background:orange}
.hidden{display:none}
</style>
</head>
<body>

<div id="login">
<h1>👑 SMART PRONO<br>ESPACE ADMIN</h1>
<div class="card">
<p>Entre ton code PIN :</p>
<input type="password" id="pin" placeholder="Code PIN">
<button class="btn-gold" onclick="checkPin()">ENTRER</button>
<p style="font-size:12px;color:gray">Code par défaut : 1234 - Change-le dans le code après</p>
</div>
</div>

<div id="admin" class="hidden">
<h1>👑 ADMIN SMART PRONO</h1>
<p>Bienvenue Boss, MR Flan Prince - FMP</p>

<div class="card">
<h3>💰 PAIEMENTS EN ATTENTE</h3>
<div id="paiements"></div>
<button class="btn-gold" onclick="loadPaiements()">🔄 ACTUALISER</button>
</div>

<div class="card">
<h3>⚽ GÉRER LES PRONOS</h3>
<label>Prono Foot :</label>
<textarea id="pronoFoot">Victoire équipe à domicile - Cote 1.85</textarea>
<label>Prono Tennis :</label>
<textarea id="pronoTennis">Victoire joueur favori - Cote 1.70</textarea>
<label>Prono Basket :</label>
<textarea id="pronoBasket">Plus de 145 points - Cote 1.80</textarea>
<button class="btn-green" onclick="savePronos()">✅ ENREGISTRER PRONOS</button>
</div>

<div class="card">
<h3>💸 GÉRER LES PRIX</h3>
<label>Prix 1 Prono :</label>
<input id="prix1" value="500">
<label>Prix VIP Jour :</label>
<input id="prix2" value="2000">
<label>Prix VIP Semaine :</label>
<input id="prix3" value="5000">
<label>Numéro Wave :</label>
<input id="wave" value="Maman Enis">
<button class="btn-green" onclick="savePrix()">✅ ENREGISTRER PRIX</button>
</div>

<button class="btn-red" onclick="location.reload()">🚪 DÉCONNEXION</button>
</div>

<script>
// --- PIN ADMIN ---
function checkPin(){
  let pin = document.getElementById('pin').value;
  if(pin === '1234'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
    loadPaiements();
  } else {
    alert('PIN incorrect Boss !');
  }
}

// --- PAIEMENTS ---
// Exemple : Si quelqu'un paie 50F au lieu de 500F, ça sera en ROUGE
let paiementsTest = [
  {nom:'Jean', offre:'1 Prono - 500F', montantPaye:50, montantAttendu:500, idWave:'W123456', date:'16/11/2026'},
  {nom:'Awa', offre:'VIP Jour - 2000F', montantPaye:2000, montantAttendu:2000, idWave:'W789012', date:'16/11/2026'}
];

function loadPaiements(){
  let div = document.getElementById('paiements');
  div.innerHTML = '';
  // On récupère aussi les vrais paiements du site
  let vrais = JSON.parse(localStorage.getItem('paiements') || '[]');
  let tous = [...vrais, ...paiementsTest];

  if(tous.length === 0){ div.innerHTML = 'Aucun paiement en attente'; return; }

  tous.forEach((p, i)=>{
    let correct = p.montantPaye === p.montantAttendu;
    div.innerHTML += `
    <div class="card" style="border:1px solid ${correct ? 'green' : 'red'}">
      <b>${p.nom}</b> - ${p.offre}<br>
      Payé : <b>${p.montantPaye}F</b> / Attendu : <b>${p.montantAttendu}F</b><br>
      ID Wave : ${p.idWave} - ${p.date}<br>
      <span class="badge ${correct ? 'ok' : 'bad'}">${correct ? 'MONTANT OK' : '⚠️ MONTANT FAUX - 50F ! REFUSER'}</span><br><br>
      <button class="btn-green" onclick="valider(${i},'${p.nom}')">✅ VALIDER</button>
      <button class="btn-red" onclick="refuser(${i},'${p.nom}')">❌ REFUSER</button>
    </div>`;
  });
}

function valider(i, nom){
  // Vérification anti-doublon ID Wave
  let dejaUtilise = localStorage.getItem('id_'+nom);
  if(dejaUtilise){ alert('Ce ID Wave a déjà été utilisé !'); return; }
  alert(nom + ' VALIDÉ ✅ - Il reçoit son prono');
  localStorage.setItem('id_'+nom, 'utilise');
  loadPaiements();
}
function refuser(i, nom){
  alert(nom + ' REFUSÉ ❌ - Montant incorrect, il a payé 50F');
  loadPaiements();
}

function savePronos(){ alert('Pronos enregistrés Boss ✅'); }
function savePrix(){ alert('Prix enregistrés Boss ✅'); }
</script>
</body>
</html>
